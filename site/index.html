<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0b0a" />
    <meta name="robots" content="noindex, nofollow" />
    <title>millarossli</title>
    <link rel="icon" href="favicon.png" />
    <link rel="preload" href="fonts/codex.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/terminal.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <main id="term">
      <header id="hud">
        <div class="hud-top">
          <svg id="logo" viewBox="0 0 64 44" aria-hidden="true"></svg>
          <div id="case"></div>
          <div id="clock" aria-label="T+">
            <div class="tplus">T+</div>
            <div class="nonacci"><i></i><i></i><i></i><i></i></div>
            <div class="tplain" hidden></div>
          </div>
        </div>
        <div id="progress"></div>
      </header>
      <div id="screen">
        <div id="out" aria-live="polite"></div>
      </div>
      <form id="line" autocomplete="off">
        <label for="in" class="ps1">&gt;</label>
        <input
          id="in"
          name="in"
          type="text"
          enterkeyhint="send"
          autocapitalize="off"
          autocorrect="off"
          autocomplete="off"
          spellcheck="false"
        />
      </form>
    </main>
  </body>
</html>
